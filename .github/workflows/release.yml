name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: '1'
  RELEASE_VERSION: ${{ github.ref_name }}
  # Keep test socket paths below macOS's Unix socket path limit.
  TMPDIR: /tmp

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and validate ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-amd64
          - runner: macos-15
            platform: darwin-arm64
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.17.0'
          use-cache: false
      - name: Install native test prerequisites
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends build-essential pkg-config vim less htop ncurses-term file binutils
          else
            brew install pkgconf htop
          fi
          command -v vim less htop pkg-config
          infocmp xterm-256color >/dev/null
      - name: Build the tagged commit
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_SHA^{commit}")"
          test "$(go env GOOS)-$(go env GOARCH)" = "$PLATFORM"
          make build VERSION="$RELEASE_VERSION"
          mkdir -p dist
          install -m 755 bs "dist/bs-$PLATFORM"
      - name: Test native PTYs, daemon, clients and terminal rendering
        run: |
          make test
          export PKG_CONFIG_PATH="$PWD/.deps/ghostty-install/share/pkgconfig"
          go test -race -count=1 ./...
      - name: Verify executable, provenance and static Ghostty symbols
        run: |
          binary="dist/bs-$PLATFORM"
          test -x "$binary"
          test "$("$binary" -v)" = "bs $RELEASE_VERSION"
          go version -m "$binary"
          go version -m "$binary" | grep -F "vcs.revision=$(git rev-parse HEAD)"
          go version -m "$binary" | grep -F 'vcs.modified=false'
          go version -m "$binary" | grep -F 'CGO_ENABLED=1'
          nm "$binary" | grep -E ' [Tt] _?ghostty_terminal_new$'
          file "$binary"
      - name: Verify Linux architecture and dynamic dependencies
        if: runner.os == 'Linux'
        run: |
          binary="dist/bs-$PLATFORM"
          file "$binary" | grep -E 'ELF 64-bit.*x86-64'
          readelf -d "$binary"
          needed="$(readelf -d "$binary" | awk '/\(NEEDED\)/ {gsub(/[][]/, "", $5); print $5}')"
          test -n "$needed"
          while IFS= read -r library; do
            case "$library" in
              libc.so.6|libm.so.6|libpthread.so.0|libdl.so.2|librt.so.1|libresolv.so.2) ;;
              *) echo "Unexpected dynamic dependency: $library" >&2; exit 1 ;;
            esac
          done <<< "$needed"
          ldd "$binary"
      - name: Verify macOS architecture and dynamic dependencies
        if: runner.os == 'macOS'
        run: |
          binary="dist/bs-$PLATFORM"
          file "$binary" | grep -F 'Mach-O 64-bit executable arm64'
          otool -L "$binary"
          needed="$(otool -L "$binary" | tail -n +2 | awk '{print $1}')"
          test -n "$needed"
          while IFS= read -r library; do
            case "$library" in
              *[Gg]hostty*) echo "Ghostty must be statically linked: $library" >&2; exit 1 ;;
              /usr/lib/*|/System/Library/*) ;;
              *) echo "Unexpected dynamic dependency: $library" >&2; exit 1 ;;
            esac
          done <<< "$needed"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/bs-${{ matrix.platform }}
          archive: false
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish both executables
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bs-*
          path: dist
          merge-multiple: true
      - name: Check the complete asset set
        run: |
          test "$(find dist -type f | wc -l)" -eq 2
          test -s dist/bs-linux-amd64
          test -s dist/bs-darwin-arm64
          chmod 755 dist/bs-linux-amd64 dist/bs-darwin-arm64
      - name: Upload both executables to a draft
        id: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/bs-linux-amd64
            dist/bs-darwin-arm64
          body: |
            Download the executable for your platform, run `chmod +x bs-*`, and launch it.
            Ghostty is embedded; no Go, Zig or Ghostty installation is needed.
      - name: Verify uploaded assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" |
            jq -e --arg tag "$RELEASE_VERSION" '
              .tag_name == $tag and .draft and
              ([.assets[].name] | sort) == ["bs-darwin-arm64", "bs-linux-amd64"] and
              all(.assets[]; .state == "uploaded" and .size > 0)'
          gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,assets |
            jq -e --arg tag "$RELEASE_VERSION" '
              .tagName == $tag and (.isDraft | not) and
              ([.assets[].name] | sort) == ["bs-darwin-arm64", "bs-linux-amd64"]'
